# NACBench static SPA vhost for Linux VPS (Nginx + Certbot)
# Installed by deploy/vps/setup-server.sh to /etc/nginx/sites-available/nacbench.thetezos.com
# Certbot (`certbot --nginx -d nacbench.thetezos.com --redirect`) will add the 443 TLS block automatically.

server {
    listen 80;
    listen [::]:80;
    server_name nacbench.thetezos.com;

    root /var/www/nacbench;
    index index.html;

    # Compression for static JS/CSS/JSON/SVG assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # Security headers (note: repeated in child location blocks that set Cache-Control,
    # because Nginx does not inherit server-level add_header when a location sets add_header)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; object-src 'none';" always;

    # Never cache SPA entrypoint so clients immediately pick up new hashed bundles
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; object-src 'none';" always;
    }

    # Long-lived immutable cache for Vite content-hashed assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    # Allow Let's Encrypt HTTP-01 challenges cleanly
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
        try_files $uri =404;
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny dotfiles (except .well-known above)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
